<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mingo Spa - Massage Dưỡng Sinh & Gội Đầu Hàn Quốc</title>
  <meta name="description" content="Mingo Spa - Thư giãn là cách bạn nạp lại năng lượng để sống tốt hơn mỗi ngày. Massage dưỡng sinh và gội đầu Hàn Quốc tại Tân An, Long An.">

  <!-- Google Fonts: Dancing Script (Thư pháp mềm mại) & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ========================================================
       BẢNG MÀU CHUẨN POSTER THAM CHIẾU MINGO SPA
       ======================================================== */
    :root {
      --bg-cream: #FAF6F0;
      --bg-white: #FFFFFF;
      --brand-pink: #C82463;          /* Hồng mận thương hiệu */
      --brand-pink-soft: #FDF1F5;     /* Nền hồng nhạt */
      --brand-green-dark: #23372C;    /* Xanh rêu đậm sang trọng */
      --brand-green-accent: #5D7052;  /* Xanh lá nhẹ */
      --text-main: #2D332D;
      --text-muted: #6C726A;
      --border-line: #EBE4D8;
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-pill: 50px;
      --shadow-card: 0 10px 25px rgba(0, 0, 0, 0.05);
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .calligraphy {
      font-family: 'Dancing Script', cursive;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 20px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Nút Đặt Lịch Chuẩn */
    .btn-pink {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #D4266A 0%, var(--brand-pink) 100%);
      color: #fff !important;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 26px;
      border-radius: var(--radius-pill);
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(200, 36, 99, 0.3);
      transition: var(--transition);
      white-space: nowrap;
    }

    .btn-pink:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(200, 36, 99, 0.42);
    }

    /* ========================================================
       1. THANH ĐIỀU HƯỚNG & XỬ LÝ LOGO TO RÕ, TỰ TÁCH NỀN
       ======================================================== */
    .header-nav {
      background: rgba(250, 246, 240, 0.98);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 10px 0;
      border-bottom: 1px solid rgba(235, 228, 216, 0.8);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* ĐÃ NÂNG KÍCH THƯỚC VÀ XÓA NỀN TRẮNG BẰNG CSS */
    .brand-logo-img {
      height: 68px; /* Tăng kích thước từ 46px lên 68px */
      width: auto;
      max-width: 220px;
      object-fit: contain;
      mix-blend-mode: multiply; /* TỰ ĐỘNG BIẾN NỀN TRẮNG CỦA ẢNH THÀNH TRONG SUỐT */
      filter: contrast(105%);
      display: block;
    }

    .brand-name {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--brand-pink);
      letter-spacing: 1px;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 22px;
      align-items: center;
    }

    .nav-links a {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      transition: var(--transition);
    }

    .nav-links a i {
      color: var(--brand-pink);
      font-size: 0.88rem;
    }

    .nav-links a:hover, .nav-links a.active {
      color: var(--brand-pink);
      background: rgba(200, 36, 99, 0.08);
    }

    .mobile-menu-btn {
      display: none;
      font-size: 1.6rem;
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
    }

    /* ========================================================
       2. HERO SECTION
       ======================================================== */
    .hero-section {
      padding: 45px 0 65px;
      position: relative;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 40px;
    }

    .hero-quote {
      font-size: 2.35rem;
      color: #383431;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--brand-pink);
      letter-spacing: 1.5px;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 1.3rem;
      font-weight: 600;
      color: #4A5048;
      margin-bottom: 30px;
    }

    /* 4 Tiện ích tròn bên dưới tiêu đề */
    .hero-tags-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: var(--bg-white);
      padding: 16px 12px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-line);
      margin-bottom: 32px;
    }

    .tag-item {
      text-align: center;
      border-right: 1px solid var(--border-line);
      padding: 0 4px;
    }

    .tag-item:last-child {
      border-right: none;
    }

    .tag-item i {
      font-size: 1.45rem;
      color: var(--brand-pink);
      margin-bottom: 6px;
      display: inline-block;
    }

    .tag-item span {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
    }

    .hero-image-wrap {
      position: relative;
    }

    .hero-main-photo {
      border-radius: 32px;
      overflow: hidden;
      border: 6px solid var(--bg-white);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.09);
      aspect-ratio: 4/4.8;
    }

    .hero-main-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ========================================================
       3. VÌ SAO NÊN CHỌN MINGO SPA?
       ======================================================== */
    .why-section {
      padding: 30px 0 50px;
      text-align: center;
    }

    .section-title-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      font-size: 2.15rem;
      font-weight: 800;
      color: #2F3630;
      margin-bottom: 6px;
    }

    .section-title-line::before,
    .section-title-line::after {
      content: "";
      height: 1px;
      width: 65px;
      background: #C4BBB0;
    }

    .section-desc {
      font-size: 0.98rem;
      color: var(--text-muted);
      margin-bottom: 35px;
    }

    .why-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .why-card {
      background: var(--bg-white);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-md);
      padding: 24px 16px;
      box-shadow: var(--shadow-card);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .why-card:hover {
      transform: translateY(-4px);
      border-color: var(--brand-pink);
    }

    .why-icon-bubble {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #EFF4ED;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.55rem;
      color: var(--brand-green-accent);
      margin-bottom: 6px;
    }

    .why-card h4 {
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
    }

    /* ========================================================
       4. CÁC COMBO DỊCH VỤ NỔI BẬT
       ======================================================== */
    .combos-section {
      padding: 30px 0 60px;
    }

    .combo-lotus-title {
      text-align: center;
      font-size: 2.15rem;
      font-weight: 800;
      color: #2E362F;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .combo-lotus-title i {
      color: var(--brand-pink);
      font-size: 1.7rem;
    }

    .combos-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 35px;
      margin-bottom: 40px;
    }

    .combo-card {
      background: var(--bg-white);
      border: 1px solid var(--border-line);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      text-align: center;
      padding-bottom: 22px;
      position: relative;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .combo-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.08);
      border-color: var(--brand-pink);
    }

    .combo-card.hot {
      border: 2px solid var(--brand-pink);
    }

    .hot-ribbon {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--brand-pink);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      box-shadow: 0 4px 10px rgba(200, 36, 99, 0.35);
      z-index: 2;
    }

    .combo-thumb {
      height: 180px;
      width: 100%;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .combo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .combo-card:hover .combo-thumb img {
      transform: scale(1.06);
    }

    .combo-badge-pill {
      display: inline-block;
      background: var(--brand-green-dark);
      color: #fff;
      font-weight: 700;
      font-size: 0.82rem;
      padding: 4px 16px;
      border-radius: var(--radius-pill);
      margin-bottom: 8px;
    }

    .combo-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: #2F352E;
      margin-bottom: 15px;
    }

    .combo-check-list {
      list-style: none;
      text-align: left;
      padding: 0 24px;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .combo-check-list li {
      font-size: 0.92rem;
      color: #4C5248;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .combo-check-list li i {
      color: var(--brand-pink);
      font-size: 0.85rem;
    }

    .price-pill {
      background: var(--brand-pink);
      color: #fff;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 10px 20px;
      border-radius: var(--radius-pill);
      display: inline-block;
      margin: 0 auto 12px;
      box-shadow: 0 4px 12px rgba(200, 36, 99, 0.25);
    }

    .book-link-text {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      display: inline-block;
      transition: var(--transition);
    }

    .book-link-text:hover {
      color: var(--brand-pink);
    }

    /* 4 Dải cam kết ngang */
    .commit-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      background: var(--bg-white);
      padding: 18px 20px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border-line);
    }

    .commit-cell {
      display: flex;
      align-items: center;
      gap: 12px;
      border-right: 1px solid var(--border-line);
      padding-right: 8px;
    }

    .commit-cell:last-child {
      border-right: none;
    }

    .commit-cell i {
      font-size: 1.55rem;
      color: var(--brand-pink);
    }

    .commit-cell span {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    /* ========================================================
       5. ĐÁNH GIÁ KHÁCH HÀNG (TESTIMONIALS)
       ======================================================== */
    .testimonials-section {
      padding: 20px 0 60px;
    }

    .testi-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      margin-top: 35px;
    }

    .testi-card {
      background: var(--bg-white);
      border: 1px solid var(--border-line);
      border-radius: var(--radius-md);
      padding: 24px 20px;
      box-shadow: var(--shadow-card);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .testi-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 12px;
      border: 3px solid var(--bg-cream);
    }

    .testi-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .testi-quote {
      font-size: 0.92rem;
      font-style: italic;
      color: #4A5046;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .testi-name {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .testi-job {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .testi-stars {
      color: #ECA22F;
      font-size: 0.85rem;
    }

    /* ========================================================
       6. KHỐI CHÂN TRANG ĐẬM (FOOTER)
       ======================================================== */
    .footer-dark {
      background: var(--brand-green-dark);
      color: #E2E8E0;
      padding: 45px 0 35px;
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr 1.15fr;
      align-items: center;
      gap: 30px;
      padding-bottom: 35px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .footer-brand h3 {
      font-size: 1.85rem;
      font-weight: 800;
      color: #FF7597;
      margin-bottom: 4px;
    }

    .footer-slogan {
      font-size: 1.6rem;
      color: #FAF6F0;
    }

    /* XỬ LÝ KHUNG LOGO TẠI CHÂN TRANG */
    .footer-logo-badge {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      padding: 6px;
      height: 48px;
      width: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .footer-logo-badge img {
      height: 36px;
      width: auto;
      object-fit: contain;
    }

    .footer-cta-center {
      text-align: center;
    }

    .footer-cta-center h4 {
      font-size: 1.1rem;
      font-weight: 800;
      color: #FAF6F0;
      margin-bottom: 14px;
      line-height: 1.4;
      letter-spacing: 0.
