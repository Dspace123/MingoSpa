<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mingo Spa - Massage Dưỡng Sinh & Gội Đầu Hàn Quốc</title>
  <meta name="description" content="Mingo Spa - Không gian dưỡng sinh, trị liệu cổ vai gáy, massage body đá nóng và gội đầu Hàn Quốc cao cấp tại Tân An, Long An.">

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ========================================================
       1. BẢNG MÀU THƯƠNG HIỆU MINGO SPA (BRAND GUIDELINE)
       ======================================================== */
    :root {
      --xanh-ebony: #555D50;    /* 40% - Thanh lịch, thiên nhiên */
      --kem-nga: #F7F3EB;       /* 40% - Tinh tế, nhẹ nhàng */
      --hong-dam: #A64D68;      /* 15% - Điểm nhấn chim Hồng Hạc */
      --be-am: #C7B49A;         /* 5%  - Sang trọng, ấm cúng */
      --dark-green: #3B4237;
      --text-main: #2D312E;
      --text-muted: #6B7268;
      --white: #FFFFFF;
      --shadow-soft: 0 10px 30px rgba(85, 93, 80, 0.08);
      --shadow-hover: 0 15px 35px rgba(166, 77, 104, 0.15);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--kem-nga);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .serif-font {
      font-family: 'Cormorant Garamond', serif;
      letter-spacing: 0.5px;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 30px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--hong-dam) 0%, #87364E 100%);
      color: var(--white);
      box-shadow: 0 6px 20px rgba(166, 77, 104, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      background: linear-gradient(135deg, #b85372 0%, #993b57 100%);
    }

    .btn-outline {
      border: 1.5px solid var(--xanh-ebony);
      color: var(--xanh-ebony);
      background: transparent;
    }

    .btn-outline:hover {
      background: var(--xanh-ebony);
      color: var(--white);
    }

    .section-title-wrap {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 50px;
    }

    .sub-badge {
      display: inline-block;
      color: var(--hong-dam);
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .main-heading {
      font-size: 2.8rem;
      color: var(--xanh-ebony);
      font-weight: 700;
      line-height: 1.2;
    }

    /* ========================================================
       2. TOP BAR & NAVIGATION
       ======================================================== */
    .top-bar {
      background: var(--xanh-ebony);
      color: var(--kem-nga);
      font-size: 0.85rem;
      padding: 8px 0;
    }

    .top-bar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-info {
      display: flex;
      gap: 20px;
    }

    .top-info span i {
      color: var(--be-am);
      margin-right: 6px;
    }

    .navbar {
      background: rgba(247, 243, 235, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
      padding: 12px 0;
      transition: var(--transition);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      fill: var(--hong-dam);
    }

    .brand-text h1 {
      font-size: 1.8rem;
      color: var(--hong-dam);
      line-height: 1;
      font-weight: 700;
    }

    .brand-text p {
      font-size: 0.7rem;
      color: var(--xanh-ebony);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 32px;
    }

    .nav-links a {
      font-weight: 600;
      color: var(--xanh-ebony);
      font-size: 0.95rem;
      position: relative;
      transition: var(--transition);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--hong-dam);
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--hong-dam);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .mobile-toggle {
      display: none;
      font-size: 1.6rem;
      color: var(--xanh-ebony);
      background: none;
      border: none;
      cursor: pointer;
    }

    /* ========================================================
       3. HERO SECTION
       ======================================================== */
    .hero {
      position: relative;
      padding: 80px 0 100px;
      background: radial-gradient(circle at 85% 20%, rgba(199, 180, 154, 0.25) 0%, transparent 60%);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 50px;
    }

    .hero-content h2 {
      font-size: 3.6rem;
      line-height: 1.15;
      color: var(--xanh-ebony);
      margin-bottom: 20px;
    }

    .hero-content h2 span {
      color: var(--hong-dam);
      font-style: italic;
    }

    .hero-desc {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 35px;
      max-width: 520px;
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 35px;
    }

    .badge-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(85, 93, 80, 0.08);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--xanh-ebony);
    }

    .badge-item i {
      color: var(--hong-dam);
    }

    .hero-cta {
      display: flex;
      gap: 18px;
    }

    .hero-image-wrapper {
      position: relative;
    }

    .hero-img-card {
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      border: 8px solid var(--white);
      position: relative;
    }

    .hero-float-card {
      position: absolute;
      bottom: -25px;
      left: -25px;
      background: var(--white);
      padding: 18px 24px;
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
      display: flex;
      align-items: center;
      gap: 16px;
      border-left: 5px solid var(--hong-dam);
    }

    .hero-float-card i {
      font-size: 2rem;
      color: var(--hong-dam);
    }

    .hero-float-card h4 {
      font-size: 1.2rem;
      color: var(--xanh-ebony);
    }

    .hero-float-card p {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* ========================================================
       4. BRAND STORY & PHILOSOPHY
       ======================================================== */
    .story-section {
      padding: 90px 0;
      background: var(--white);
    }

    .story-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
    }

    .story-quote-box {
      background: var(--kem-nga);
      padding: 40px;
      border-radius: 20px;
      border-left: 6px solid var(--be-am);
      position: relative;
    }

    .story-quote-box blockquote {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.55rem;
      font-style: italic;
      color: var(--xanh-ebony);
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .story-author {
      font-weight: 700;
      color: var(--hong-dam);
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .story-details p {
      margin-bottom: 20px;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .privilege-card {
      background: var(--kem-nga);
      border-radius: 16px;
      padding: 24px;
      margin-top: 25px;
      border: 1px dashed var(--xanh-ebony);
    }

    .privilege-card h4 {
      color: var(--xanh-ebony);
      font-size: 1.3rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .privilege-list {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 0.9rem;
    }

    .privilege-list li i {
      color: var(--hong-dam);
      margin-right: 6px;
    }

    /* ========================================================
       5. FEATURED COMBOS (MENU 1)
       ======================================================== */
    .combos-section {
      padding: 100px 0;
      background: var(--kem-nga);
    }

    .combos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 30px;
    }

    .combo-card {
      background: var(--white);
      border-radius: 20px;
      padding: 32px;
      box-shadow: var(--shadow-soft);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid rgba(199, 180, 154, 0.3);
    }

    .combo-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
      border-color: var(--hong-dam);
    }

    .combo-card.popular {
      border: 2px solid var(--hong-dam);
    }

    .popular-tag {
      position: absolute;
      top: -12px;
      right: 25px;
      background: var(--hong-dam);
      color: var(--white);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .combo-header {
      border-bottom: 1px solid rgba(85, 93, 80, 0.1);
      padding-bottom: 18px;
      margin-bottom: 20px;
    }

    .combo-header h3 {
      font-size: 1.8rem;
      color: var(--xanh-ebony);
      margin-bottom: 6px;
    }

    .price-wrap {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .current-price {
      font-size: 2rem;
      font-weight: 800;
      color: var(--hong-dam);
    }

    .old-price {
      font-size: 1.1rem;
      color: #A0A59E;
      text-decoration: line-through;
    }

    .combo-services {
      list-style: none;
      margin-bottom: 28px;
      flex-grow: 1;
    }

    .combo-services li {
      font-size: 0.95rem;
      padding: 8px 0;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .combo-services li i {
      color: var(--hong-dam);
      font-size: 0.85rem;
    }

    /* ========================================================
       6. ALACARTE MENU (MENU 2 TABS)
       ======================================================== */
    .menu-tabs-section {
      padding: 90px 0;
      background: var(--white);
    }

    .tab-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 45px;
    }

    .tab-btn {
      padding: 12px 24px;
      background: var(--kem-nga);
      border: 1px solid var(--be-am);
      border-radius: 40px;
      color: var(--xanh-ebony);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.95rem;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--xanh-ebony);
      color: var(--white);
      border-color: var(--xanh-ebony);
    }

    .menu-group {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
      gap: 25px;
    }

    .menu-group.active {
      display: grid;
    }

    .menu-item-row {
      background: var(--kem-nga);
      padding: 20px 24px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: var(--transition);
    }

    .menu-item-row:hover {
      background: #EFEAE0;
      transform: translateX(4px);
    }

    .item-name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--xanh-ebony);
      margin-bottom: 4px;
    }

    .item-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .item-cost {
      text-align: right;
      min-width: 110px;
    }

    .item-cost .price {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--hong-dam);
    }

    .item-cost .time {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: block;
    }

    /* ========================================================
       7. GALLERY & AMBIANCE
       ======================================================== */
    .gallery-section {
      padding: 90px 0;
      background: var(--kem-nga);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .gallery-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      height: 320px;
      box-shadow: var(--shadow-soft);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.08);
    }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(59, 66, 55, 0.85) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 20px;
      color: var(--white);
    }

    .gallery-overlay h4 {
      font-size: 1.3rem;
      color: var(--kem-nga);
    }

    /* ========================================================
       8. BOOKING MODAL & FLOATING ACTION BUTTONS
       ======================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: var(--kem-nga);
      width: 100%;
      max-width: 550px;
      border-radius: 24px;
      padding: 40px;
      position: relative;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      border: 1px solid var(--be-am);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      color: var(--xanh-ebony);
      background: none;
      border: none;
      cursor: pointer;
    }

    .modal-title {
      font-size: 2.2rem;
      color: var(--xanh-ebony);
      margin-bottom: 8px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--xanh-ebony);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #D5CEBF;
      border-radius: 10px;
      background: var(--white);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: var(--transition);
    }

    .form-control:focus {
      border-color: var(--hong-dam);
      box-shadow: 0 0 0 3px rgba(166, 77, 104, 0.15);
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* Nút liên hệ nổi (Zalo & Hotline) */
    .quick-contact-fab {
      position: fixed;
      bottom: 25px;
      right: 25px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1500;
    }

    .fab-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-size: 1.4rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
      transition: var(--transition);
    }

    .fab-btn:hover {
      transform: scale(1.1);
    }

    .fab-phone {
      background: #25D366;
    }

    .fab-zalo {
      background: #0068FF;
      font-weight: 800;
      font-size: 0.95rem;
    }

    /* ========================================================
       9. FOOTER
       ======================================================== */
    footer {
      background: var(--dark-green);
      color: #C5CCC0;
      padding: 70px 0 30px;
      border-top: 5px solid var(--hong-dam);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 50px;
      margin-bottom: 50px;
    }

    .footer-brand h2 {
      color: var(--kem-nga);
      font-size: 2.2rem;
      margin-bottom: 15px;
    }

    .footer-brand p {
      font-size: 0.95rem;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .footer-links h4, .footer-contact h4 {
      color: var(--kem-nga);
      font-size: 1.4rem;
      margin-bottom: 20px;
      position: relative;
    }

    .footer-links ul {
      list-style: none;
    }

    .footer-links li {
      margin-bottom: 10px;
    }

    .footer-links a:hover {
      color: var(--hong-dam);
      padding-left: 6px;
      transition: var(--transition);
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    .contact-item i {
      color: var(--be-am);
      margin-top: 4px;
      font-size: 1.1rem;
    }

    .copyright {
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 25px;
      font-size: 0.85rem;
      color: #9AA096;
    }

    /* ========================================================
       10. RESPONSIVE MEDIA QUERIES
       ======================================================== */
    @media (max-width: 992px) {
      .hero-grid, .story-grid, .footer-grid {
        grid-template-columns: 1fr;
      }
      .hero-content {
        text-align: center;
      }
      .hero-badges {
        justify-content: center;
      }
      .hero-cta {
        justify-content: center;
      }
      .hero-float-card {
        left: 20px;
        bottom: 20px;
      }
      .menu-group {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .top-bar {
        display: none;
      }
      .nav-links {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--kem-nga);
        flex-direction: column;
        padding: 25px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        gap: 18px;
      }
      .nav-links.active {
        display: flex;
      }
      .mobile-toggle {
        display: block;
      }
      .main-heading {
        font-size: 2.2rem;
      }
      .hero-content h2 {
        font-size: 2.6rem;
      }
      .form-grid-2 {
        grid-template-columns: 1fr;
      }
      .privilege-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- TOP INFO BAR -->
  <aside class="top-bar" aria-label="Thông tin nhanh">
    <div class="container top-bar-inner">
      <div class="top-info">
        <span><i class="fa-solid fa-location-dot" aria-hidden="true"></i> 219 Hùng Vương, Phường 3, TP. Tân An, Long An</span>
        <span><i class="fa-regular fa-clock" aria-hidden="true"></i> Mở cửa đón khách: 09:00 - 22:00</span>
      </div>
      <div>
        <span><i class="fa-solid fa-phone" aria-hidden="true"></i> Hotline: <strong>05 83 83 0123 - 09 09 09 4333</strong></span>
      </div>
    </div>
  </aside>

  <!-- NAVIGATION BAR -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="#" class="brand-logo" aria-label="Trang chủ Mingo Spa">
